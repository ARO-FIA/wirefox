name: Publish

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Publish to JSR
        run: npx jsr publish